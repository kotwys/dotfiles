<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
  <!--
    sans-serif should use Inter (always for Western characters) and the
    system Japanese font (if it matches the language tag).

    The mode here should always be "prepend", so that other rules that
    reference these would actually pick up these overrides as "real matches".
    (Otherwise, e.g. -apple-system would become Noto Sans by some reason.)
  -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit binding="strong" mode="prepend" name="family">
      <string>Inter</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit binding="weak" mode="prepend" name="family">
      <string>-ui-japanese</string>
    </edit>
  </match>

  <!-- Similarly, serif -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit binding="strong" mode="append" name="family">
      <string>Noto Serif</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>BIZ UDMincho</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit binding="strong" mode="prepend" name="family">
      <string>PlemolJP35 Console</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>-ui-japanese</string></test>
    <edit binding="same" name="family" mode="append">
      <string>IBM Plex Sans JP</string>
    </edit>
  </match>
</fontconfig>
